<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall · 2026 season timing</title>
<meta name="description" content="Every lap of every driver in every 2026 F1 race: lap times, fastest laps, tyres and pit stops. Free, open source.">
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B0C10; --panel: #14161D; --line: #242733; --ink: #F2F3F5; --muted: #8A8F9E; --red: #E10600; --green: #22C55E; --purple: #A855F7; --yellow: #FACC15; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 'Titillium Web', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100dvh; }
header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.logo i { width: 10px; height: 22px; background: var(--red); transform: skewX(-18deg); display: inline-block; }
.tabs { display: flex; gap: 6px; }
.tabs a { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); }
.tabs a.on { color: var(--ink); background: var(--red); border-color: var(--red); }
.spacer { flex: 1; }
select { font: 700 15px 'Titillium Web'; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 100%; }
.summary { display: flex; gap: 22px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: baseline; }
.summary h1 { font: 900 22px/1.1 'Titillium Web'; margin: 0; }
.summary .k { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.summary .v { font-weight: 700; }
.summary .v.p { color: var(--purple); }
.legend { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.wrap { overflow: auto; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; font: 500 12.5px 'JetBrains Mono'; }
th, td { padding: 6px 9px; white-space: nowrap; border-bottom: 1px solid var(--line); text-align: right; }
thead th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font: 700 11px 'Titillium Web'; letter-spacing: .06em; z-index: 2; }
.st { position: sticky; background: var(--bg); z-index: 1; text-align: left; }
thead .st { z-index: 3; }
.c0 { left: 0; width: 46px; min-width: 46px; max-width: 46px; } .c1 { left: 46px; width: 92px; min-width: 92px; max-width: 92px; }
.c2 { left: 138px; width: 128px; min-width: 128px; max-width: 128px; border-right: 1px solid var(--line); }
td.pos { font: 900 15px 'Titillium Web'; color: var(--ink); }
td.drv { font: 700 14px 'Titillium Web'; }
td.drv b { display: inline-block; width: 4px; height: 16px; border-radius: 2px; margin-right: 8px; vertical-align: -3px; }
td.res { color: var(--muted); }
tr.sel td { background: #1B1E28; }
tr.sel td.st { background: #1B1E28; }
td.lap { cursor: pointer; color: #C9CCD4; }
td.lap.pb { color: var(--green); font-weight: 700; }
td.lap.fl { background: var(--purple); color: #fff; font-weight: 700; border-radius: 4px; }
td.lap.pit { color: var(--yellow); }
td.lap small { font: 700 9px 'Titillium Web'; margin-left: 4px; padding: 0 4px; border-radius: 3px; background: var(--yellow); color: #000; vertical-align: 1px; }
td.lap i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
td.empty { color: #3A3F50; }
.pop { position: fixed; z-index: 9; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 500 12.5px 'JetBrains Mono'; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
.pop b { font-family: 'Titillium Web'; font-size: 14px; display: block; margin-bottom: 4px; }
footer { padding: 10px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center; }
footer a { color: inherit; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font-weight: 700; letter-spacing: .1em; color: var(--muted); z-index: 9; }
@media (max-width: 760px) {
  header { padding: 10px 14px; gap: 10px; } .summary { padding: 10px 14px; gap: 14px; }
  .c2 { display: none; } .c1 { width: 72px; min-width: 72px; max-width: 72px; }
}
</style>
</head>
<body>
<div class="loading" id="loading">LOADING SEASON…</div>
<div class="app">
  <header>
    <a class="logo" href="index.html"><i></i>PIT WALL</a>
    <nav class="tabs"><a href="index.html" id="replayTab">Replay</a><a href="timing.html" class="on">Season timing</a></nav>
    <div class="spacer"></div>
    <select id="race" aria-label="Race"></select>
  </header>
  <section class="summary" id="summary"></section>
  <div class="wrap"><table id="tbl"></table></div>
  <footer>Data: <a href="https://openf1.org">OpenF1</a> (unofficial, not associated with Formula 1) · built with Claude by <a href="https://instagram.com/raj_triess">@raj_triess</a></footer>
</div>
<div class="pop" id="pop"></div>
<script type="module" src="timing.js"></script>
</body>
</html>
